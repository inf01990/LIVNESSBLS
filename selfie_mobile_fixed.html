<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Selfie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.hdr{background:#1a237e;width:100%;padding:18px;text-align:center}
.hdr h1{font-size:1.2em}
.sec{padding:15px;width:100%;max-width:500px}
label{display:block;font-size:.85em;margin:10px 0 4px;color:#aaa}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#fff;font-size:1em}
.ok-border{border-color:#4caf50!important}
.cam{position:relative;width:100%;max-width:500px;aspect-ratio:3/4;background:#111;border-radius:16px;overflow:hidden;margin:10px 0}
.cam video{width:100%;height:100%;object-fit:cover}
.cam canvas{display:none}
.guide{position:absolute;top:12%;left:18%;width:64%;height:58%;border:3px solid rgba(255,255,255,.4);border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.4)}
.btn{padding:14px 35px;border:none;border-radius:12px;font-size:1.1em;font-weight:600;cursor:pointer;margin:8px;min-width:130px}
.bg{background:#4caf50;color:#fff;width:90%;max-width:400px}
.bb{background:#2196f3;color:#fff;font-size:1.3em;padding:18px 50px;border-radius:50px}
.bo{background:#ff9800;color:#fff}
.br{background:#f44336;color:#fff}
.st{padding:14px;margin:10px;border-radius:10px;text-align:center;font-weight:600;width:calc(100% - 30px);max-width:500px}
.s-ok{background:#1b5e20}.s-err{background:#b71c1c}.s-info{background:#0d47a1}.s-wait{background:#4a148c}.s-warn{background:#e65100}
.hidden{display:none!important}
.actions{display:flex;flex-wrap:wrap;justify-content:center;padding:8px}
.preview{width:100%;max-width:500px;border-radius:16px}
.sinfo{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:10px;margin:8px 15px;font-size:.8em;color:#888}
.sinfo b{color:#4caf50}
.log-box{background:#0d0d1a;border:1px solid #333;border-radius:10px;width:calc(100% - 30px);max-width:500px;margin:10px 15px;max-height:200px;overflow-y:auto;padding:10px;font-size:.75em;font-family:monospace;color:#aaa;white-space:pre-wrap;word-break:break-all}
.log-box .ok{color:#4caf50}.log-box .err{color:#f44336}.log-box .warn{color:#ff9800}.log-box .info{color:#64b5f6}
.copy-btn{background:#333;color:#aaa;border:1px solid #555;border-radius:6px;padding:6px 16px;font-size:.8em;cursor:pointer;margin:5px}
.counter{color:#ff9800;text-align:center;font-size:.9em;margin:5px}
</style>
</head>
<body>

<div class="hdr"><h1>📱 Selfie Mobile</h1></div>

<div id="step-phone" class="sec">
  <label>📱 Ton numéro</label>
  <input type="tel" id="inp-phone" placeholder="0772145577">
  <div class="actions"><button class="btn bg" onclick="loadSession()">🔄 Charger la session</button></div>
  <div style="text-align:center;color:#555;margin:15px 0;font-size:.85em">— ou manuel —</div>
  <label>Appointment ID</label>
  <input type="number" id="inp-appid" placeholder="280820">
  <label>Fingerprint</label>
  <input type="text" id="inp-fp" placeholder="5d473...">
  <div class="actions"><button class="btn bg" onclick="startManual()">📷 Mode manuel</button></div>
</div>

<div id="step-camera" class="hidden">
  <div id="session-info" class="sinfo"></div>
  <div class="cam">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="guide"></div>
  </div>
  <div class="actions"><button class="btn bb" onclick="capture()">📸 Capturer</button></div>
</div>

<div id="step-preview" class="hidden">
  <img id="preview" class="preview">
  <div class="actions">
    <button class="btn bo" onclick="retryCapture()">🔄 Reprendre</button>
    <button class="btn bg" onclick="sendVerify()">✅ Envoyer</button>
  </div>
</div>

<div id="status" class="st s-info hidden"></div>
<div id="counter" class="counter hidden"></div>

<div id="step-result" class="hidden">
  <div class="actions">
    <button class="btn bo" onclick="retryCapture()">🔄 Reprendre photo</button>
    <button class="btn bg" onclick="sendVerify()">🔁 Renvoyer</button>
  </div>
</div>

<div id="log-container" class="hidden" style="width:100%;max-width:530px;padding:0 15px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <span style="font-size:.85em;color:#888">📋 Log</span>
    <button class="copy-btn" onclick="copyLog()">📋 Copier</button>
  </div>
  <div id="log-box" class="log-box"></div>
</div>

<script>
/*
 * Tous les appels BLS liveness passent par le relais Flask (/api/liveness/...)
 * pour contourner CORS. Aucun cookie de session n'est exposé au navigateur.
 *
 * v6 :
 *  - Parsing enrichi de /verify-face (verified, upstream_status, raw)
 *  - Distinction no_session / empty_auth / upstream_error / refus liveness
 *  - Check /api/status au chargement pour prévenir si session absente
 *  - Statut "warn" pour les cas ambigus
 *
 * Une action utilisateur = une seule requête. Pas de retry automatique.
 */
const RELAY = window.location.origin;
const LIVENESS = RELAY + "/api/liveness";

let stream = null;
let blob = null;
let appId = "";
let fp = "";
let totalAttempts = 0;
let successCount = 0;
let failCount = 0;
const logs = [];

function addLog(msg, cls="") {
  const entry = "[" + new Date().toLocaleTimeString() + "] " + msg;
  logs.push(entry);
  const box = document.getElementById("log-box");
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = entry + "\n";
  box.appendChild(span);
  box.scrollTop = box.scrollHeight;
  show("log-container");
}

function copyLog() {
  const text = logs.join("\n");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector(".copy-btn");
      btn.textContent = "✅ Copié!";
      setTimeout(() => btn.textContent = "📋 Copier", 2000);
    });
  }
}

function updateCounter() {
  document.getElementById("counter").textContent =
    "Tentatives: " + totalAttempts + " | ✅ " + successCount + " | ❌ " + failCount;
  show("counter");
}

(function initFromUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get("id")) document.getElementById("inp-appid").value = p.get("id");
  if (p.get("fp")) document.getElementById("inp-fp").value = p.get("fp");
  if (p.get("phone")) document.getElementById("inp-phone").value = p.get("phone");

  if (p.get("id") && p.get("fp")) setTimeout(startManual, 300);
  else if (p.get("phone")) setTimeout(loadSession, 300);
})();

function show(id) { document.getElementById(id).classList.remove("hidden"); }
function hide(id) { document.getElementById(id).classList.add("hidden"); }

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "st " + cls;
  show("status");
}

// ═══════════════════════════════════════════════════════════════
// CHECK STATUS SERVEUR
// ═══════════════════════════════════════════════════════════════
async function checkRelaySession(phone) {
  try {
    const r = await fetch(RELAY + "/api/status", {
      headers: { "Accept": "application/json" }
    });
    if (!r.ok) {
      addLog("⚠️  /api/status HTTP " + r.status, "warn");
      return false;
    }
    const d = await r.json();
    const info = d.info && d.info[phone];
    if (!info) {
      addLog("⚠️  Relais: aucune entrée pour " + phone, "warn");
      return false;
    }
    addLog("🔎 /api/status → cookie_names=" +
      JSON.stringify(info.cookie_names || []) +
      " | auth=" + (info.has_authorization ? "oui" : "non"),
      info.has_session_cookie ? "ok" : "warn");

    if (!info.has_session_cookie) {
      setStatus(
        "⚠️ Session enregistrée mais cookies BLS absents côté serveur. Relance app.py puis recharge.",
        "s-warn"
      );
      return false;
    }
    return true;
  } catch (e) {
    addLog("⚠️  /api/status err: " + e.message, "warn");
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════
// SESSION
// ═══════════════════════════════════════════════════════════════
async function loadSession() {
  const phone = document.getElementById("inp-phone").value.trim();
  if (!phone) {
    setStatus("❌ Numéro requis", "s-err");
    return;
  }

  setStatus("🔄 Chargement...", "s-wait");
  addLog("Chargement session: " + phone, "info");

  try {
    const r = await fetch(RELAY + "/api/pull/" + encodeURIComponent(phone), {
      headers: { "Accept": "application/json" }
    });

    const d = await r.json();

    if (!r.ok || d.status !== "ok" || !d.data) {
      throw new Error(d.error || "Session introuvable");
    }

    appId = String(d.data.appointment_id || "");
    fp = String(d.data.fingerprint || "");

    if (!appId || !fp) throw new Error("Session incomplète");

    document.getElementById("inp-appid").value = appId;
    document.getElementById("inp-fp").value = fp;
    document.getElementById("inp-appid").classList.add("ok-border");
    document.getElementById("inp-fp").classList.add("ok-border");

    document.getElementById("session-info").innerHTML =
      "<b>" + escapeHtml(d.data.email || "Session") +
      "</b> | ID:" + escapeHtml(appId) + " | ✅";

    addLog("✅ Session chargée | ID:" + appId, "ok");
    addLog("Fingerprint reçu depuis le relais", "info");

    // ── NOUVEAU : vérifier que Flask a bien les cookies BLS ──
    const hasAuth = await checkRelaySession(phone);
    if (hasAuth) {
      setStatus("✅ Session chargée + cookies BLS OK", "s-ok");
    } else {
      // on continue quand même — l'utilisateur peut vouloir tester
      addLog("➡️  On ouvre la caméra malgré l'avertissement", "warn");
    }

    setTimeout(openCamera, 600);

  } catch (e) {
    addLog("❌ Erreur relay: " + e.message, "err");
    setStatus("❌ " + e.message, "s-err");
  }
}

function startManual() {
  appId = document.getElementById("inp-appid").value.trim();
  fp = document.getElementById("inp-fp").value.trim();

  if (!appId || !fp) {
    setStatus("❌ Remplis les deux champs", "s-err");
    return;
  }

  addLog("Mode manuel | ID:" + appId, "info");
  openCamera();
}

// ═══════════════════════════════════════════════════════════════
// CAMÉRA
// ═══════════════════════════════════════════════════════════════
async function openCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Caméra non disponible dans ce navigateur");
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });

    document.getElementById("video").srcObject = stream;
    hide("step-phone");
    hide("status");
    show("step-camera");
    addLog("📷 Caméra ouverte", "ok");

    // Device-info via proxy Flask (pas de CORS)
    try {
      const dr = await fetch(
        LIVENESS + "/device-info?appointment_id=" + encodeURIComponent(appId),
        {
          method: "POST",
          headers: {
            "Accept": "application/json, text/plain, */*",
            "Content-Type": "application/json",
            "x-device-fingerprint": fp,
            "x-lang": "fr"
          },
          body: JSON.stringify({
            user_agent: navigator.userAgent,
            platform: navigator.platform || "web",
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
          })
        }
      );

      addLog("Device-info → HTTP " + dr.status, dr.ok ? "info" : "warn");

      if (dr.status === 401) {
        try {
          const dj = await dr.json();
          if (dj.error === "no_session" || dj.error === "empty_auth") {
            addLog("⚠️  Relais n'a pas les cookies BLS → selfie échouera", "warn");
            setStatus("⚠️ Session BLS non poussée côté serveur. Relance app.py.", "s-warn");
          }
        } catch (_) {}
      }
    } catch (e) {
      addLog("❌ Device-info network: " + e.name + " | " + e.message, "err");
      addLog("   URL: " + LIVENESS + "/device-info", "warn");
    }

  } catch (e) {
    addLog("❌ Caméra: " + e.message, "err");
    setStatus("❌ Caméra: " + e.message, "s-err");
  }
}

// ═══════════════════════════════════════════════════════════════
// CAPTURE
// ═══════════════════════════════════════════════════════════════
function capture() {
  const v = document.getElementById("video");
  const c = document.getElementById("canvas");

  if (!v.videoWidth || !v.videoHeight) {
    setStatus("❌ Flux caméra pas encore prêt", "s-err");
    return;
  }

  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);

  c.toBlob((b) => {
    if (!b) {
      setStatus("❌ Impossible de créer l'image", "s-err");
      return;
    }

    if (blob) URL.revokeObjectURL(document.getElementById("preview").src);
    blob = b;
    document.getElementById("preview").src = URL.createObjectURL(b);

    hide("step-camera");
    hide("step-result");
    show("step-preview");
    addLog("📸 Photo capturée (" + Math.round(b.size / 1024) + " KB)", "ok");
  }, "image/jpeg", 0.92);
}

function retryCapture() {
  hide("step-preview");
  hide("step-result");
  hide("status");
  show("step-camera");
  addLog("🔄 Nouvelle capture...", "info");
}

// ═══════════════════════════════════════════════════════════════
// ENVOI VERIFY-FACE — v6
// ═══════════════════════════════════════════════════════════════
async function sendVerify() {
  if (!blob) {
    setStatus("❌ Aucune photo", "s-err");
    return;
  }

  totalAttempts++;
  updateCounter();

  setStatus("📤 Envoi...", "s-wait");
  hide("step-preview");
  hide("step-result");

  addLog("─── Tentative #" + totalAttempts + " ───", "info");

  try {
    const fd = new FormData();
    fd.append("captured_image", blob, "selfie.jpg");

    const t0 = performance.now();

    const r = await fetch(
      LIVENESS + "/verify-face?appointment_id=" + encodeURIComponent(appId),
      {
        method: "POST",
        headers: {
          "Accept": "application/json, text/plain, */*",
          "x-device-fingerprint": fp,
          "x-lang": "fr"
        },
        body: fd
      }
    );

    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    const contentType = r.headers.get("content-type") || "";
    let d = null;

    if (contentType.includes("application/json")) {
      d = await r.json();
    } else {
      d = { message: await r.text() };
    }

    addLog("← HTTP " + r.status + " | " + elapsed + "s", "info");
    addLog("← Body: " + JSON.stringify(d).substring(0, 400), r.ok ? "info" : "warn");

    // ═══ CAS 1 : succès confirmé (Flask v5 renvoie verified=true) ═══
    if (r.ok && d && (d.verified === true || d.status === "ok" || d.success === true)) {
      successCount++;
      updateCounter();
      setStatus("✅ Selfie vérifié par le serveur", "s-ok");
      addLog("✅ verified=" + d.verified +
             " | upstream=" + (d.upstream_status ?? "?"), "ok");

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      return;
    }

    failCount++;
    updateCounter();

    // ═══ CAS 2 : session BLS absente côté relais ═══
    if (r.status === 401 && d && (d.error === "no_session" || d.error === "empty_auth")) {
      addLog("⚠️  Relais: " + d.error + " — " + (d.message || ""), "warn");
      setStatus(
        "❌ Session BLS absente côté serveur (" + d.error + "). Relance app.py pour repousser la session.",
        "s-err"
      );
      show("step-result");
      return;
    }

    // ═══ CAS 3 : upstream liveness injoignable ═══
    if (r.status === 502 && d && d.error === "upstream_error") {
      addLog("⚠️  Upstream liveness: " + (d.detail || ""), "warn");
      setStatus("❌ API liveness injoignable. Réessaie dans quelques secondes.", "s-err");
      show("step-result");
      return;
    }

    // ═══ CAS 4 : liveness a explicitement refusé ═══
    if (r.ok && d && d.verified === false) {
      addLog("❌ Liveness a refusé la photo | upstream=" +
             (d.upstream_status ?? "?"), "err");
      addLog("   raw: " + JSON.stringify(d.raw || {}).substring(0, 250), "warn");
      setStatus("❌ Selfie refusé (visage non détecté ?). Reprends la photo.", "s-err");
      show("step-result");
      return;
    }

    // ═══ CAS 5 : fallback générique ═══
    const retryAfter = r.headers.get("Retry-After");
    if (retryAfter) {
      addLog("⏱️ Retry-After: " + retryAfter + " — aucun retry automatique", "warn");
    }

    setStatus(
      "❌ Vérification non confirmée (HTTP " + r.status + "). Réessaie manuellement.",
      "s-err"
    );
    show("step-result");

  } catch (e) {
    failCount++;
    updateCounter();
    addLog("❌ Network: " + e.name + " | " + e.message, "err");
    addLog("   URL: " + LIVENESS + "/verify-face", "warn");
    addLog("   → Vérifie F12 → Network + que Flask tourne", "warn");
    setStatus("❌ Requête impossible: " + e.message, "s-err");
    show("step-result");
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

window.addEventListener("beforeunload", () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (blob) {
    const src = document.getElementById("preview").src;
    if (src.startsWith("blob:")) URL.revokeObjectURL(src);
  }
});
</script>
</body>
</html>
